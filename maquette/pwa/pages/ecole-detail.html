<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#582cfd" />
  <title>Fiche école — Qiryna</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet" />
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
<div class="screen-shell">
  <div class="screen page-ed">

    <div class="ed-header">
      <div class="ed-main">

        <header class="ed-topbar">
          <a href="liste-ecole.html" class="ed-back" data-ed-back aria-label="Retour">
            <img src="../assets/icons/ic-lang-back.svg" alt="" width="24" height="24" />
          </a>
          <a href="home.html" class="ed-logo-frame" aria-label="Accueil">
            <img src="../assets/images/logo.png" alt="Qiryna" />
          </a>
          <div class="ed-notif">
            <img src="../assets/icons/ic-bell.svg" alt="" width="25" height="25" />
            <span class="ed-notif-badge">3</span>
          </div>
        </header>

        <div class="ed-hero-block">
          <div class="ed-hero">
            <img data-ed-hero src="../assets/images/ecoles/hero-esa.jpg" alt="" />
          </div>
          <div class="ed-hero-overlay">
            <div class="ed-badge" data-ed-badge>
              <img class="ed-badge-logo" data-ed-school-logo src="../assets/images/ecoles/logo-esa.png" alt="" width="72" height="72" />
              <div class="ed-badge-lines" aria-hidden="true">
                <span data-ed-badge-l1>ÉCOLE</span>
                <span data-ed-badge-l2>SPÉCIALE</span>
                <span data-ed-badge-l3>D'ARCHITECTURE</span>
                <span class="ed-badge-city" data-ed-badge-l4>PARIS</span>
              </div>
            </div>
            <div class="ed-hero-actions">
              <button type="button" class="ed-icon-btn" aria-label="Ajouter aux favoris">
                <img src="../assets/icons/ic-ed-heart.svg" alt="" width="18" height="18" />
              </button>
              <button type="button" class="ed-icon-btn" aria-label="Partager">
                <img src="../assets/icons/ic-ed-share.svg" alt="" width="18" height="18" />
              </button>
            </div>
          </div>
        </div>

        <div class="ed-title-block">
          <h1 class="ed-title" data-ed-title>École Spéciale d’Architecture – Paris</h1>
          <div class="ed-loc">
            <span class="ed-loc-icon">
              <img src="../assets/icons/ic-ed-pin.svg" alt="" width="10" height="13" />
            </span>
            <span data-ed-city>Paris, France</span>
          </div>
        </div>

        <div class="ed-content">
          <div class="ed-tabs" role="tablist" aria-label="Sections">
            <button type="button" class="ed-tab" role="tab" aria-selected="false" data-ed-tab="presentation">
              <svg class="ed-tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 2.5h10a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5Z" stroke="currentColor" stroke-linejoin="round"/><path d="M5 5.5h6M5 8h6M5 10.5h4" stroke="currentColor" stroke-linecap="round"/></svg>
              <span>Présentation</span>
            </button>
            <button type="button" class="ed-tab is-active" role="tab" aria-selected="true" data-ed-tab="formations">
              <svg class="ed-tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4.5 8 1.5l5.5 3v4.5L8 12.5 2.5 9V4.5Z" stroke="currentColor" stroke-linejoin="round"/><path d="M8 1.5v11M2.5 4.5 8 7.5l5.5-3" stroke="currentColor" stroke-linejoin="round"/></svg>
              <span>Formations</span>
            </button>
            <button type="button" class="ed-tab" role="tab" aria-selected="false" data-ed-tab="points">
              <svg class="ed-tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5 9.6 5.8l4.6.4-3.5 3 1 4.5L8 11.8 4.3 13.7l1-4.5-3.5-3 4.6-.4L8 1.5Z" stroke="currentColor" stroke-linejoin="round"/></svg>
              <span>Points forts</span>
            </button>
          </div>

          <div class="ed-panels">
            <section class="ed-panel" data-ed-panel="presentation" hidden>
              <div class="ed-presentation" data-ed-presentation></div>
            </section>

            <section class="ed-panel is-active" data-ed-panel="formations">
              <div class="ed-formations" data-ed-formations></div>
            </section>

            <section class="ed-panel" data-ed-panel="points" hidden>
              <ul class="ed-points" data-ed-points></ul>
            </section>
          </div>
        </div>

      </div>
    </div>

    <a href="offre-orientation.html" class="ed-float-cta btn-primary" data-ed-float-cta>Être accompagné pour candidater</a>

    <div class="ed-form-modal" data-ed-form-modal hidden aria-hidden="true">
      <div class="ed-form-modal-backdrop" data-ed-form-modal-close tabindex="-1"></div>
      <div class="ed-form-modal-panel" role="dialog" aria-modal="true" aria-labelledby="ed-form-modal-title">
        <header class="ed-form-modal-header">
          <h2 id="ed-form-modal-title" class="ed-form-modal-title" data-ed-form-modal-title></h2>
          <button type="button" class="ed-form-modal-close" data-ed-form-modal-close aria-label="Fermer">
            <img src="../assets/icons/ic-menu-close.svg" alt="" width="14" height="14" />
          </button>
        </header>
        <div class="ed-form-modal-body" data-ed-form-modal-body></div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <a href="home.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-home.svg" alt="" width="24" height="24" /></span>
        <span>Accueil</span>
      </a>
      <a href="messages.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-messages.svg" alt="" width="24" height="24" /></span>
        <span>Messages</span>
      </a>
      <a href="#" class="nav-item nav-item--orientation" aria-current="page">
        <span class="nav-item__icon"><img src="../assets/icons/ic-orientation-logo.png" alt="" class="nav-orientation-logo" width="36" height="34" /></span>
        <span>Orientation</span>
      </a>
      <a href="mon-projet.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-projet.svg" alt="" width="24" height="24" /></span>
        <span>Mon projet</span>
      </a>
      <a href="connexion.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-compte.svg" alt="" width="24" height="24" /></span>
        <span>Compte</span>
      </a>
    </nav>

  </div>
</div>

<script type="module">
  import { getSchoolById, buildFormationDetailHtml } from '../js/schools.js';

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js').catch(() => {});
    });
  }

  const params = new URLSearchParams(window.location.search);
  const school = getSchoolById(params.get('ecole') || 'esa');
  const pays = params.get('pays') || 'france';
  const domaine = params.get('domaine') || school.domaine || 'architecture';

  const back = document.querySelector('[data-ed-back]');
  if (back) {
    back.href = `liste-ecole.html?pays=${encodeURIComponent(pays)}&domaine=${encodeURIComponent(domaine)}`;
  }

  document.title = `${school.name} — Qiryna`;

  const hero = document.querySelector('[data-ed-hero]');
  if (hero) {
    hero.src = school.hero;
    hero.alt = school.name;
  }

  const logoImg = document.querySelector('[data-ed-school-logo]');
  const badgeEl = document.querySelector('[data-ed-badge]');
  if (logoImg && school.logo) {
    logoImg.src = school.logo;
    logoImg.alt = school.name;
    badgeEl?.classList.remove('is-text');
  } else if (badgeEl) {
    badgeEl.classList.add('is-text');
  }

  const setText = (sel, val) => {
    const el = document.querySelector(sel);
    if (el) el.textContent = val || '';
  };

  const badge = school.badge || [];
  const lines = [badge[0], badge[1], badge[2], badge[3]].map((v) => (v && String(v).trim()) || '\u00a0');
  setText('[data-ed-badge-l1]', lines[0]);
  setText('[data-ed-badge-l2]', lines[1]);
  setText('[data-ed-badge-l3]', lines[2]);
  setText('[data-ed-badge-l4]', lines[3]);
  setText('[data-ed-title]', school.name);
  setText('[data-ed-city]', school.city);

  const presentation = document.querySelector('[data-ed-presentation]');
  if (presentation) {
    presentation.innerHTML = school.presentation
      .map((p) => `<p>${p}</p>`)
      .join('');
  }

  const modal = document.querySelector('[data-ed-form-modal]');
  const modalTitle = document.querySelector('[data-ed-form-modal-title]');
  const modalBody = document.querySelector('[data-ed-form-modal-body]');
  const scrollEl = document.querySelector('.page-ed .ed-main');
  const floatCta = document.querySelector('[data-ed-float-cta]');
  let modalOpen = false;
  let lastScroll = scrollEl?.scrollTop || 0;
  const SCROLL_DELTA = 6;

  function setFloatCtaVisible(visible) {
    if (!floatCta || modalOpen) return;
    floatCta.classList.toggle('is-hidden', !visible);
  }

  function updateFloatCtaFromScroll() {
    if (!scrollEl || !floatCta || modalOpen) return;

    const st = scrollEl.scrollTop;
    const maxScroll = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    const atBottom = maxScroll - st <= 32;
    const delta = st - lastScroll;

    if (atBottom || st <= 8) {
      setFloatCtaVisible(true);
    } else if (delta > SCROLL_DELTA) {
      setFloatCtaVisible(false);
    } else if (delta < -SCROLL_DELTA) {
      setFloatCtaVisible(true);
    }

    lastScroll = st;
  }

  function openFormationModal(formation) {
    if (!modal || !modalTitle || !modalBody) return;
    modalTitle.textContent = formation.title;
    modalBody.innerHTML = buildFormationDetailHtml(formation.detail);
    modal.hidden = false;
    modal.setAttribute('aria-hidden', 'false');
    scrollEl?.classList.add('ed-scroll-locked');
    modalOpen = true;
    floatCta?.classList.add('is-hidden');
  }

  function closeFormationModal() {
    if (!modal) return;
    modal.hidden = true;
    modal.setAttribute('aria-hidden', 'true');
    scrollEl?.classList.remove('ed-scroll-locked');
    modalOpen = false;
    updateFloatCtaFromScroll();
  }

  document.querySelectorAll('[data-ed-form-modal-close]').forEach((el) => {
    el.addEventListener('click', closeFormationModal);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal && !modal.hidden) closeFormationModal();
  });

  const formations = document.querySelector('[data-ed-formations]');
  if (formations) {
    formations.innerHTML = school.formations
      .map(
        (f, i) => `
      <button type="button" class="ed-form-card" data-ed-form-index="${i}">
        <div class="ed-form-icon">
          <img src="${f.icon}" alt="" width="44" height="44" />
        </div>
        <div class="ed-form-body">
          <h3>${f.title}</h3>
          <div class="ed-form-meta">
            <span class="ed-form-meta-item">
              <img src="../assets/icons/ic-ed-grad.svg" alt="" width="12" height="9" />
              <span>${f.grade}</span>
            </span>
            <span class="ed-form-sep" aria-hidden="true">|</span>
            <span class="ed-form-meta-item">
              <img src="../assets/icons/ic-ed-clock.svg" alt="" width="9" height="9" />
              <span>${f.duration}</span>
            </span>
          </div>
          <p>${f.desc}</p>
        </div>
        <img class="ed-form-chevron" src="../assets/icons/ic-ed-chevron.svg" alt="" width="16" height="16" />
      </button>`
      )
      .join('');

    formations.querySelectorAll('[data-ed-form-index]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.edFormIndex);
        const formation = school.formations[idx];
        if (formation) openFormationModal(formation);
      });
    });
  }

  const points = document.querySelector('[data-ed-points]');
  if (points) {
    points.innerHTML = school.pointsForts.map((p) => `<li>${p}</li>`).join('');
  }

  const tabs = [...document.querySelectorAll('[data-ed-tab]')];
  const panels = [...document.querySelectorAll('[data-ed-panel]')];

  function activateTab(id) {
    tabs.forEach((tab) => {
      const on = tab.dataset.edTab === id;
      tab.classList.toggle('is-active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    panels.forEach((panel) => {
      const on = panel.dataset.edPanel === id;
      panel.classList.toggle('is-active', on);
      panel.hidden = !on;
    });
    lastScroll = scrollEl?.scrollTop || 0;
    updateFloatCtaFromScroll();
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => activateTab(tab.dataset.edTab));
  });

  const initialTab = params.get('tab') || 'formations';
  activateTab(['presentation', 'formations', 'points'].includes(initialTab) ? initialTab : 'formations');

  if (scrollEl && floatCta) {
    floatCta.href = `offre-orientation.html?ecole=${encodeURIComponent(school.id)}&pays=${encodeURIComponent(pays)}&domaine=${encodeURIComponent(domaine)}`;

    let ticking = false;
    scrollEl.addEventListener(
      'scroll',
      () => {
        if (!ticking) {
          requestAnimationFrame(() => {
            updateFloatCtaFromScroll();
            ticking = false;
          });
          ticking = true;
        }
      },
      { passive: true }
    );

    updateFloatCtaFromScroll();
  } else if (floatCta) {
    floatCta.href = `offre-orientation.html?ecole=${encodeURIComponent(school.id)}&pays=${encodeURIComponent(pays)}&domaine=${encodeURIComponent(domaine)}`;
  }
</script>
</body>
</html>
