<script type="module">
  import { mountComponents } from '../js/components.js';
  mountComponents();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js').catch(() => {});
    });
  }

  const cards = [...document.querySelectorAll('.dest-card')];
  const params = new URLSearchParams(window.location.search);
  const selected = params.get('pays');

  const selectCard = (card) => {
    cards.forEach((c) => {
      const on = c === card;
      c.classList.toggle('is-selected', on);
      c.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  };

  cards.forEach((card) => {
    if (selected && card.dataset.pays === selected) {
      selectCard(card);
    }

    card.addEventListener('click', () => {
      selectCard(card);
      const pays = card.dataset.pays || 'france';
      window.location.href = `offres-logement.html?pays=${encodeURIComponent(pays)}`;
    });
  });
</script>
</body>
</html>
