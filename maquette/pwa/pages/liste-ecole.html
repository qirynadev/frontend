<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#582cfd" />
  <title>Liste école — Qiryna</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
<div class="screen-shell">
  <div class="screen page-le">

    <div class="le-header">
      <div class="le-main">

        <header class="le-topbar">
          <a href="domaines-etude.html" class="le-back" data-le-back aria-label="Retour">
            <img src="../assets/icons/ic-lang-back.svg" alt="" width="24" height="24" />
          </a>
          <div class="le-logo-frame">
            <img src="../assets/images/logo.png" alt="Qiryna" />
          </div>
          <div class="le-notif">
            <img src="../assets/icons/ic-bell.svg" alt="" width="25" height="25" />
            <span class="le-notif-badge">3</span>
          </div>
        </header>

        <!-- Domain chips carousel (Figma 541:74) -->
        <div class="le-domains">
          <div class="le-domains-row">
            <div class="le-chips" data-le-chips role="listbox" aria-label="Domaines d'étude">
              <button type="button" class="le-chip is-selected" role="option" aria-selected="true" data-domaine="architecture">
                <span class="le-chip-icon le-chip-icon--arch">
                  <img src="../assets/icons/ic-le-chip-arch.svg" alt="" width="11" height="14" />
                </span>
                <span class="le-chip-label">Architecture</span>
              </button>
              <button type="button" class="le-chip" role="option" aria-selected="false" data-domaine="management">
                <span class="le-chip-icon le-chip-icon--mgmt">
                  <img src="../assets/icons/ic-le-chip-mgmt.svg" alt="" width="16" height="14" />
                </span>
                <span class="le-chip-label">Management</span>
              </button>
              <button type="button" class="le-chip" role="option" aria-selected="false" data-domaine="ingenierie">
                <span class="le-chip-icon le-chip-icon--ing">
                  <img src="../assets/icons/ic-le-chip-ing.svg" alt="" width="21" height="21" />
                </span>
                <span class="le-chip-label">Ingénierie</span>
              </button>
              <button type="button" class="le-chip" role="option" aria-selected="false" data-domaine="medecine">
                <span class="le-chip-icon le-chip-icon--med">
                  <img src="../assets/icons/ic-dom-med.svg" alt="" width="18" height="18" />
                </span>
                <span class="le-chip-label">Médecine</span>
              </button>
              <button type="button" class="le-chip" role="option" aria-selected="false" data-domaine="sciences-politiques">
                <span class="le-chip-icon le-chip-icon--pol">
                  <img src="../assets/icons/ic-dom-pol.svg" alt="" width="18" height="18" />
                </span>
                <span class="le-chip-label">Sciences politiques</span>
              </button>
              <button type="button" class="le-chip" role="option" aria-selected="false" data-domaine="sciences">
                <span class="le-chip-icon le-chip-icon--sci">
                  <img src="../assets/icons/ic-dom-sci.svg" alt="" width="18" height="18" />
                </span>
                <span class="le-chip-label">Sciences</span>
              </button>
            </div>
            <button type="button" class="le-chips-next" data-le-chips-next aria-label="Domaines suivants">
              <img src="../assets/icons/ic-le-chip-next.svg" alt="" width="9" height="9" />
            </button>
          </div>
          <div class="le-dots" data-le-dots aria-hidden="true">
            <span class="le-dot is-active"></span>
            <span class="le-dot"></span>
            <span class="le-dot"></span>
            <span class="le-dot"></span>
            <span class="le-dot"></span>
            <span class="le-dot"></span>
          </div>
        </div>

        <!-- School list (Figma 546:190) -->
        <div class="le-list-block">
          <div class="le-schools" data-le-schools></div>

          <div data-pagination data-pages="4" data-current="1"></div>
        </div>

        <div data-trust-bar></div>

      </div>
    </div>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <a href="home.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-home.svg" alt="" width="24" height="24" /></span>
        <span>Accueil</span>
      </a>
      <a href="messages.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-messages.svg" alt="" width="24" height="24" /></span>
        <span>Messages</span>
      </a>
      <a href="#" class="nav-item nav-item--orientation" aria-current="page">
        <span class="nav-item__icon"><img src="../assets/icons/ic-orientation-logo.png" alt="" class="nav-orientation-logo" width="36" height="34" /></span>
        <span>Orientation</span>
      </a>
      <a href="mon-projet.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-projet.svg" alt="" width="24" height="24" /></span>
        <span>Mon projet</span>
      </a>
      <a href="connexion.html" class="nav-item">
        <span class="nav-item__icon"><img src="../assets/icons/nav-compte.svg" alt="" width="24" height="24" /></span>
        <span>Compte</span>
      </a>
    </nav>

  </div>
</div>

<script type="module">
  import { mountComponents } from '../js/components.js';
  import { SCHOOLS } from '../js/schools.js';
  mountComponents();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js').catch(() => {});
    });
  }

  const DOMAINES = [
    { id: 'architecture', label: 'Architecture' },
    { id: 'management', label: 'Management' },
    { id: 'ingenierie', label: 'Ingénierie' },
    { id: 'medecine', label: 'Médecine' },
    { id: 'sciences-politiques', label: 'Sciences politiques' },
    { id: 'sciences', label: 'Sciences' },
  ];

  const params = new URLSearchParams(window.location.search);
  const pays = params.get('pays') || 'france';
  let domaine = params.get('domaine') || 'architecture';
  if (!DOMAINES.some((d) => d.id === domaine)) domaine = 'architecture';

  const back = document.querySelector('[data-le-back]');
  if (back) back.href = `domaines-etude.html?pays=${encodeURIComponent(pays)}`;

  const schoolsEl = document.querySelector('[data-le-schools]');
  const chipsEl = document.querySelector('[data-le-chips]');
  const chips = [...document.querySelectorAll('.le-chip')];
  const dots = [...document.querySelectorAll('[data-le-dots] .le-dot')];
  const nextBtn = document.querySelector('[data-le-chips-next]');

  function schoolsForDomaine(id) {
    const filtered = SCHOOLS.filter((s) => s.domaine === id);
    return filtered.length ? filtered : SCHOOLS;
  }

  function renderSchools() {
    if (!schoolsEl) return;
    const list = schoolsForDomaine(domaine);
    schoolsEl.innerHTML = list
      .map(
        (s) => `
      <a href="ecole-detail.html?ecole=${encodeURIComponent(s.id)}&pays=${encodeURIComponent(pays)}&domaine=${encodeURIComponent(domaine)}" class="le-school" data-ecole="${s.id}">
        <div class="le-school-logo">
          <img src="${s.logo}" alt="" width="56" height="56" />
        </div>
        <div class="le-school-body">
          <p class="le-school-name">${s.name}</p>
          <div class="le-school-loc">
            <span class="le-school-loc-icon">
              <img src="../assets/icons/ic-le-pin.svg" alt="" width="10" height="13" />
            </span>
            <span>${s.city}</span>
          </div>
          <div class="le-school-meta">
            <span class="le-school-meta-item">
              <img src="../assets/icons/ic-le-calendar.svg" alt="" width="10" height="14" />
              <span>Année de création : ${s.year}</span>
            </span>
            <span class="le-school-meta-item">
              <img src="../assets/icons/ic-le-users.svg" alt="" width="8" height="7" />
              <span>${s.students} étudiants</span>
            </span>
          </div>
        </div>
        <div class="le-school-aside">
          <div class="le-school-thumb">
            <img src="${s.thumb}" alt="" width="64" height="64" />
          </div>
        </div>
      </a>`
      )
      .join('');
  }

  function selectDomaine(id, { scroll = true } = {}) {
    domaine = id;
    chips.forEach((chip) => {
      const on = chip.dataset.domaine === id;
      chip.classList.toggle('is-selected', on);
      chip.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    const idx = Math.max(0, DOMAINES.findIndex((d) => d.id === id));
    dots.forEach((dot, i) => dot.classList.toggle('is-active', i === idx));
    renderSchools();
    if (scroll && chipsEl) {
      const chip = chips.find((c) => c.dataset.domaine === id);
      if (chip) {
        const left = chip.offsetLeft - (chipsEl.clientWidth - chip.offsetWidth) / 2;
        chipsEl.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
      }
    }
    const url = new URL(window.location.href);
    url.searchParams.set('pays', pays);
    url.searchParams.set('domaine', id);
    history.replaceState(null, '', url);
  }

  chips.forEach((chip) => {
    chip.addEventListener('click', () => selectDomaine(chip.dataset.domaine));
  });

  if (nextBtn && chipsEl) {
    nextBtn.addEventListener('click', () => {
      const step = chipsEl.clientWidth;
      const max = chipsEl.scrollWidth - chipsEl.clientWidth;
      const nextLeft = chipsEl.scrollLeft + step;
      if (nextLeft >= max - 4) {
        chipsEl.scrollTo({ left: 0, behavior: 'smooth' });
      } else {
        chipsEl.scrollBy({ left: step, behavior: 'smooth' });
      }
      const idx = DOMAINES.findIndex((d) => d.id === domaine);
      selectDomaine(DOMAINES[(idx + 1) % DOMAINES.length].id, { scroll: false });
    });
  }

  if (chipsEl) {
    let scrollTimer;
    chipsEl.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const mid = chipsEl.scrollLeft + chipsEl.clientWidth / 2;
        let best = 0;
        let bestDist = Infinity;
        chips.forEach((chip, i) => {
          const c = chip.offsetLeft + chip.offsetWidth / 2;
          const dist = Math.abs(c - mid);
          if (dist < bestDist) {
            bestDist = dist;
            best = i;
          }
        });
        dots.forEach((dot, i) => dot.classList.toggle('is-active', i === best));
      }, 80);
    });
  }

  selectDomaine(domaine, { scroll: false });
</script>
</body>
</html>
